<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout Page</title>
</head>
<body>
  <div class="checkout-container">
    <h1>Your Cart</h1>
    <div class="cart-items">
      <p>Item 1 - $49.00</p>
    </div>

    <!-- The button was refactored: id removed, modern data-testid and accessible name added -->
    <div class="actions">
      <button type="submit" data-testid="checkout-submit" class="primary-btn">
        Complete Order & Pay
      </button>
    </div>
  </div>
</body>
</html>
